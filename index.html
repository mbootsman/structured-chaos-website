<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Structured Chaos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero { min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 120px 48px 80px; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,170,179,0.12) 0%, transparent 70%); pointer-events: none; }
    .hero::after { content: ''; position: absolute; bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%); pointer-events: none; }
    .hero-inner { max-width: 900px; display: flex; align-items: center; gap: 80px; position: relative; z-index: 1; }
    .hero-mark svg { width: 200px; height: 200px; flex-shrink: 0; }
    .hero-text { flex: 1; }
    .hero-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--teal); margin-bottom: 20px; }
    .hero-title { font-family: 'Inder', sans-serif; font-size: clamp(38px, 6vw, 64px); line-height: 1.05; margin-bottom: 8px; letter-spacing: 2px; }
    .hero-title .line2 { color: var(--orange); }
    .hero-sub { font-size: 18px; color: var(--muted); font-weight: 300; margin-bottom: 10px; max-width: 480px; }
    .hero-cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px; background: var(--teal); color: var(--dark); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-decoration: none; border-radius: 4px; transition: background 0.2s, transform 0.2s; }
    .hero-cta:hover { background: #00c4ce; transform: translateY(-2px); }
    section { padding: 100px 48px; }
    .section-inner { max-width: 960px; margin: 0 auto; }
    @media (max-width: 768px) {
      .hero { padding: 100px 24px 60px; }
      .hero-inner { flex-direction: column; gap: 40px; text-align: center; }
      .hero-sub { margin: 0 auto 36px; }
      section { padding: 72px 24px; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="svg/structured-chaos-logo-square.svg">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">
    <img src="svg/structured-chaos-logo-square-transparent.svg" alt="Structured Chaos logo" width="40" height="40">
    <div class="nav-wordmark">
      <span>Structured</span>
      <span>Chaos</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="/index.html" class="active">Home</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="hero" id="home">
  <div class="hero-inner">
    <div class="hero-mark">
      <img src="svg/structured-chaos-logo-square-transparent.svg" alt="Structured Chaos logo" width="310" height="310">
    </div>
    <div class="hero-text">
      <span class="hero-tag">Consulting &amp; Strategy</span>
      <h1 class="hero-title">
        <span class="line1">Structured</span><br>
        <span class="line2">Chaos</span>
      </h1>
      <p class="hero-sub">Strategy, partnerships and community. Built with intention, delivered with energy.</p>
      <a href="/contact.html" class="hero-cta">Get in touch</a>
    </div>
  </div>
</section>

<footer>
  <div class="footer-left">
    <strong>Structured Chaos B.V.</strong><br>
    &copy; 2026 | All rights reserved
  </div>
  <div class="footer-hosting">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--teal)">

    </svg>
    Hosted on <a href="https://sevalla.com" target="_blank" rel="noopener">Sevalla Static Site Hosting</a>

</footer>

</body>
</html>
