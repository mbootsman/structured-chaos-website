<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact &ndash; Structured Chaos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { min-height: 90vh; padding: 140px 48px 100px; }
    .main-inner { max-width: 640px; margin: 0 auto; }
    .section-title { margin-bottom: 32px; }
    .divider { margin: 0 0 40px; }
    .contact-block { display: flex; flex-direction: column; gap: 0; border: 1px solid rgba(0,170,179,0.15); border-radius: 6px; overflow: hidden; }
    .contact-row { display: flex; align-items: baseline; gap: 24px; padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .contact-row:last-child { border-bottom: none; }
    .contact-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); width: 140px; flex-shrink: 0; }
    .contact-value { font-size: 16px; color: var(--white); font-weight: 300; }
    .contact-value a { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s; }
    .contact-value a:hover { color: var(--orange); }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,170,179,0.25); border-top-color: var(--teal); border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      main { padding: 100px 24px 60px; }
      .contact-row { flex-direction: column; gap: 6px; }
      .contact-label { width: auto; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="svg/structured-chaos-logo-square.svg">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">
    <img src="svg/structured-chaos-logo-square-transparent.svg" alt="Structured Chaos logo" width="40" height="40">
    <div class="nav-wordmark">
      <span>Structured</span>
      <span>Chaos</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/index.html#brands">Brands</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="main-inner">
    <p class="section-label">Get in touch</p>
    <h1 class="section-title">Contact <span>&amp; Info</span></h1>
    <div class="divider"></div>

    <div class="contact-block">
      <div class="contact-row">
        <span class="contact-label">Company</span>
        <span class="contact-value">Structured Chaos B.V.</span>
      </div>
      <div class="contact-row">
        <span class="contact-label">Email</span>
        <span class="contact-value"><a href="mailto:hello@structuredchaos.nl">hello@structuredchaos.nl</a></span>
      </div>
      <div class="contact-row">
        <span class="contact-label">KvK</span>
        <span class="contact-value"><a href="https://www.kvk.nl/bestellen/#/42031861000065347129" target="_blank" rel="noopener">42031861</a></span>
      </div>
      <div class="contact-row">
        <span class="contact-label">BTW</span>
        <span class="contact-value">NL869392189B01</span>
      </div>
      <div class="contact-row">
        <span class="contact-label">IBAN</span>
        <span class="contact-value"><span class="spinner"></span></span>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-left">
    <strong>Structured Chaos B.V.</strong><br>
    &copy; 2026 | All rights reserved
  </div>

    </svg>
    Hosted on <a href="https://sevalla.com" target="_blank" rel="noopener">Sevalla Static Site Hosting</a>

</body>
</html>
