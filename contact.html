<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact &ndash; Structured Chaos</title>
  <link rel="preload" href="fonts/Inder-Regular.ttf" as="font" type="font/truetype" crossorigin>
  <style>
    @font-face {
      font-family: 'Inder';
      src: url(fonts/Inder-Regular.ttf) format('truetype');
      font-display: swap;
      ascent-override: 96%;
      descent-override: 24%;
      line-gap-override: 0%;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #00aab3;
      --orange: #FF6B35;
      --dark: #1a1a2e;
      --dark2: #161626;
      --dark3: #1e1e32;
      --white: #ffffff;
      --muted: rgba(255,255,255,0.55);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--white); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; position: relative; }
    body::before { content: ''; position: fixed; top: 50%; left: -200px; transform: translateY(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,170,179,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: var(--dark); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,170,179,0.12); }
    .nav-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .nav-wordmark { display: flex; flex-direction: column; line-height: 1.1; }
    .nav-wordmark span:first-child { font-family: 'Inder', sans-serif; font-size: 15px; letter-spacing: 3px; color: var(--white); }
    .nav-wordmark span:last-child { font-family: 'Inder', sans-serif; font-size: 15px; letter-spacing: 3px; color: var(--orange); }
    .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--teal); }
    .nav-links a.active { color: var(--white); }
    .nav-toggle-check { display: none; }
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; cursor: pointer; padding: 4px; width: 32px; height: 32px; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; transition: transform 0.25s, opacity 0.25s; transform-origin: center; }
    .nav-toggle-check:checked ~ .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle-check:checked ~ .nav-toggle span:nth-child(2) { opacity: 0; }
    .nav-toggle-check:checked ~ .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .divider { width: 60px; height: 2px; background: linear-gradient(to right, var(--teal), var(--orange)); margin: 0 0 32px; }
    .section-label { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
    .section-title { font-family: 'Inder', sans-serif; font-size: clamp(28px, 4vw, 42px); letter-spacing: 2px; margin-bottom: 20px; }
    .section-title span { color: var(--orange); }
    .section-body { font-size: 17px; color: var(--muted); font-weight: 300; max-width: 600px; line-height: 1.8; }
    footer { background: var(--dark); border-top: 1px solid rgba(255,255,255,0.07); padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .footer-left { font-size: 13px; color: var(--muted); }
    .footer-left strong { font-family: 'Inder', sans-serif; color: var(--white); letter-spacing: 1px; }
    .footer-hosting { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .footer-hosting a { color: var(--teal); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .footer-hosting a:hover { color: var(--orange); }
    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .nav-toggle { display: flex; }
      .nav-links { flex-direction: column; gap: 0; position: absolute; top: 100%; left: 0; right: 0; background: var(--dark); border-bottom: 1px solid rgba(0,170,179,0.12); max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
      .nav-toggle-check:checked ~ .nav-links { max-height: 300px; padding: 8px 0; }
      .nav-links li { width: 100%; }
      .nav-links a { display: block; padding: 14px 24px; font-size: 16px; }
      footer { padding: 24px; flex-direction: column; align-items: flex-start; }
    }
    main { min-height: 90vh; padding: 140px 48px 100px; }
    .main-inner { max-width: 640px; margin: 0 auto; }
    .section-title { margin-bottom: 32px; }
    .divider { margin: 0 0 40px; }
    .contact-block { display: flex; flex-direction: column; gap: 0; border: 1px solid rgba(0,170,179,0.15); border-radius: 6px; overflow: hidden; }
    .contact-row { display: flex; align-items: baseline; gap: 24px; padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .contact-row:last-child { border-bottom: none; }
    .contact-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); width: 140px; flex-shrink: 0; }
    .contact-value { font-size: 16px; color: var(--white); font-weight: 300; }
    .contact-value a { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s; }
    .contact-value a:hover { color: var(--orange); }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,170,179,0.25); border-top-color: var(--teal); border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      main { padding: 100px 24px 60px; }
      .contact-row { flex-direction: column; gap: 6px; }
      .contact-label { width: auto; }
    }
  </style>

</head>
